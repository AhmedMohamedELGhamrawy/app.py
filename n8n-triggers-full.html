<script>
// Suppress browser warnings from in-browser transpiler
(function(){
  const originalWarn = console.warn;
  const originalError = console.error;
  const originalLog = console.log;
  const suppress = ['in-browser', 'Babel', 'babel', 'transpil', 'Consider using'];
  console.warn = function(...args){
    if(args.some(a => suppress.some(s => String(a).includes(s)))) return;
    originalWarn.apply(console, args);
  };
  console.error = function(...args){
    if(args.some(a => suppress.some(s => String(a).includes(s)))) return;
    originalError.apply(console, args);
  };
})();
</script>
<script>
// Hide all non-critical console output
window.__origConsole = {w: console.warn, e: console.error};
const HIDE = ['in-browser Babel','Consider using','@babel','Browserslist'];
['warn','error'].forEach(m => {
  const orig = console[m].bind(console);
  console[m] = (...a) => { if(!a.some(x=>HIDE.some(h=>String(x).includes(h)))) orig(...a); };
});
</script>

function genQuiz(pool,lang){
  const sh=[...pool].sort(()=>Math.random()-0.5).slice(0,15);
  const Lx=L[lang];
  return sh.map(t=>{
    const d=t[lang];
    const qt=Math.floor(Math.random()*4);
    let q,cor,gw;
    const lvlMap={سهل:Lx.LN["سهل"],متوسط:Lx.LN["متوسط"],متقدم:Lx.LN["متقدم"],Easy:Lx.LN["Easy"],Medium:Lx.LN["Medium"],Advanced:Lx.LN["Advanced"]};
    if(qt===0){q=`${lang==="ar"?"ما هو الـ trigger المناسب لـ":"Which trigger is right for"}: "${d.short}"?`;cor=t.name;gw=()=>pool.filter(x=>x.id!==t.id).map(x=>x.name);}
    else if(qt===1){q=`${t.name} — ${lang==="ar"?"ما نوعه؟":"what type is it?"}`;cor=Lx.TN[t.type];gw=()=>Object.values(Lx.TN).filter(v=>v!==Lx.TN[t.type]);}
    else if(qt===2){q=`${t.name} — ${lang==="ar"?"ما مستوى صعوبته؟":"what difficulty level?"}`;cor=lvlMap[d.lvl];gw=()=>["سهل","متوسط","متقدم"].map(x=>lvlMap[x]).filter(v=>v!==lvlMap[d.lvl]);}
    else{q=`${lang==="ar"?"أي trigger بيستخدم لـ":"Which trigger is used for"}: "${d.e[0]}"?`;cor=t.name;gw=()=>pool.filter(x=>x.id!==t.id).map(x=>x.name);}
    const opts=[cor,...gw().sort(()=>Math.random()-0.5).slice(0,3)].sort(()=>Math.random()-0.5);
    return{question:q,correct:cor,opts,trigger:t};
  });
}

  const switchLang=(l)=>{setLang(l);setSel(null);setCat("all");setLvl("all");setTyp("all");setQ("");};

  const tcmp=(t,e)=>{e&&e.stopPropagation();setCmp(c=>c.find(x=>x.id===t.id)?c.filter(x=>x.id!==t.id):c.length<2?[...c,t]:[c[1],t]);};

    const d=t[lang];

    const lvlMap={سهل:"Easy",متوسط:"Medium",متقدم:"Advanced",Easy:"Easy",Medium:"Medium",Advanced:"Advanced"};
    const tLvl=lvlMap[d.lvl]||d.lvl;
    const ml=lvl==="all"||tLvl===lvl;
    const mt=typ==="all"||t.type===typ;

    return mc&&ml&&mt&&mq;
  });

  const startQ=()=>{setQuiz(genQuiz(T,lang));setQi(0);setSc(0);setDone(false);setCh(null);setAns([]);};

  };

            </div>

                return(
                  <div key={t.id} onClick={()=>setSel(t)} style={{background:cmp.find(x=>x.id===t.id)?"#1A2A1A":"#1A1A2E",border:"1px solid "+(cmp.find(x=>x.id===t.id)?"#4ECDC4":"#252535"),borderRadius:10,padding:"11px 10px 9px",cursor:"pointer",position:"relative"}}
                    onMouseEnter={e=>{e.currentTarget.style.borderColor=cc(t)}}
                    onMouseLeave={e=>{e.currentTarget.style.borderColor=cmp.find(x=>x.id===t.id)?"#4ECDC4":"#252535"}}>
                    <div style={{position:"absolute",top:5,left:5,display:"flex",gap:3}}>
                      <button onClick={e=>tfav(t.id,e)} style={{background:"transparent",border:"none",fontSize:10,padding:0,opacity:favs.includes(t.id)?1:0.2}}>⭐</button>
                      <button onClick={e=>tcmp(t,e)} style={{background:"transparent",border:"none",fontSize:10,padding:0,opacity:cmp.find(x=>x.id===t.id)?1:0.2}}>⚖️</button>
                    </div>
                    <div style={{fontSize:20,width:34,height:34,background:cc(t)+"22",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",marginBottom:6}}>{t.icon}</div>
                    <div style={{fontWeight:700,fontSize:10,marginBottom:2,lineHeight:1.4}}>{t.name}</div>
                    <div style={{fontSize:9,color:"#555588",lineHeight:1.5,marginBottom:5}}>{d.short}</div>
                    <div style={{display:"flex",gap:3,flexWrap:"wrap"}}>
                      <span style={{background:cc(t)+"22",color:cc(t),fontSize:8,padding:"1px 5px",borderRadius:5}}>{Lx.CN[t.cat]||t.cat}</span>
                      <span style={{background:TC[t.type]+"22",color:TC[t.type],fontSize:8,padding:"1px 5px",borderRadius:5}}>{Lx.TN[t.type]}</span>
                      <span style={{background:dc(d.lvl)+"22",color:dc(d.lvl),fontSize:8,padding:"1px 5px",borderRadius:5}}>{Lx.LN[d.lvl]||d.lvl}</span>
                    </div>
                  </div>
                );
              })}
            </div>
          )
        ):(()=>{
          const d=sel[lang];
          const bdr=Lx.dir==="rtl"?"borderRight":"borderLeft";
          return(
            <div style={{display:"flex",flexDirection:"column",gap:9}}>
              <button onClick={()=>setSel(null)} style={{background:"#1A1A2E",border:"1px solid #3A3A5A",borderRadius:8,padding:"6px 12px",color:"#E0E0F0",fontSize:11,alignSelf:"flex-start",marginTop:9}}>{Lx.back}</button>
              <div style={{background:"linear-gradient(135deg,"+cc(sel)+"22,"+cc(sel)+"08)",border:"1px solid "+cc(sel)+"55",borderRadius:12,padding:13,display:"flex",alignItems:"center",gap:10}}>
                <div style={{fontSize:24,width:46,height:46,background:cc(sel)+"33",borderRadius:11,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{sel.icon}</div>
                <div style={{flex:1}}>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <div style={{fontWeight:800,fontSize:15}}>{sel.name}</div>
                    <button onClick={e=>tfav(sel.id,e)} style={{background:"transparent",border:"none",fontSize:13,padding:0,opacity:favs.includes(sel.id)?1:0.3}}>⭐</button>
                    <button onClick={e=>tcmp(sel,e)} style={{background:"transparent",border:"none",fontSize:13,padding:0,opacity:cmp.find(x=>x.id===sel.id)?1:0.3}}>⚖️</button>
                  </div>
                  <div style={{fontSize:10,color:"#8888AA",marginTop:2}}>{d.short}</div>
                  <div style={{marginTop:5,display:"flex",gap:4,flexWrap:"wrap"}}>
                    <span style={{background:cc(sel)+"22",color:cc(sel),fontSize:9,padding:"1px 7px",borderRadius:7}}>{Lx.CN[sel.cat]||sel.cat}</span>
                    <span style={{background:TC[sel.type]+"22",color:TC[sel.type],fontSize:9,padding:"1px 7px",borderRadius:7}}>{Lx.TN[sel.type]}</span>
                    <span style={{background:dc(d.lvl)+"22",color:dc(d.lvl),fontSize:9,padding:"1px 7px",borderRadius:7}}>{Lx.LN[d.lvl]||d.lvl}</span>
                  </div>
                </div>
              </div>
              <div style={{background:"#1A1A2E",border:"1px solid #252535",borderRadius:11,padding:12,[bdr]:"3px solid "+cc(sel)}}>
                <div style={{fontSize:9,color:"#555588",marginBottom:5,fontWeight:700}}>{Lx.what}</div>
                <div style={{fontSize:12,lineHeight:1.85,color:"#D8D8F0"}}>{d.w}</div>
              </div>
              <div style={{background:"#1A1A2E",border:"1px solid #252535",borderRadius:11,padding:12,[bdr]:"3px solid #4ECDC4"}}>
                <div style={{fontSize:9,color:"#555588",marginBottom:5,fontWeight:700}}>{Lx.when}</div>
                <div style={{fontSize:12,lineHeight:1.85,color:"#D8D8F0"}}>{d.u}</div>
              </div>
              <div style={{background:"#1A1A2E",border:"1px solid #252535",borderRadius:11,padding:12}}>
                <div style={{fontSize:9,color:"#555588",marginBottom:9,fontWeight:700}}>{Lx.examples}</div>
                {d.e.map((ex,i)=>(
                  <div key={i} style={{display:"flex",gap:7,alignItems:"flex-start",marginBottom:7}}>
                    <span style={{background:cc(sel)+"33",color:cc(sel),borderRadius:"50%",width:18,height:18,display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:700,flexShrink:0,marginTop:2}}>{i+1}</span>
                    <span style={{fontSize:12,lineHeight:1.7,color:"#D8D8F0"}}>{ex}</span>
                  </div>
                ))}
              </div>
              <div style={{background:"#141408",border:"1px solid #F39C1233",borderRadius:11,padding:12,display:"flex",gap:7}}>
                <span style={{fontSize:15,flexShrink:0}}>💡</span>
                <div>
                  <div style={{fontSize:9,color:"#F39C12",marginBottom:4,fontWeight:700}}>{Lx.tip}</div>
                  <div style={{fontSize:12,lineHeight:1.85,color:"#F5CBA7"}}>{d.t}</div>
                </div>
              </div>
            </div>
          );
        })()}
      </div>
      <div style={{textAlign:"center",padding:"2px 11px 12px",color:"#222244",fontSize:9}}>{list.length}/{T.length} ⚡ Ahmed ELGhamrawy</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
